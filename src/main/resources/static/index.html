<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3 – Posts</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">📸 Posts</div>

      <form id="loginForm" class="auth">
        <input id="user" placeholder="Utilizator" value="admin" autocomplete="username">
        <input id="pass" type="password" placeholder="Parolă" autocomplete="current-password">
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div id="authInfo" class="auth hidden">
        <span class="chip">● <span id="userLabel"></span></span>
        <button id="logoutBtn" class="btn btn-ghost">Logout</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card composer">
      <h2>Postare nouă</h2>

      <input id="title" placeholder="Titlu" maxlength="120">
      <textarea id="content" placeholder="Ce vrei să împărtășești?" rows="3"></textarea>

      <div id="dropzone" class="dropzone" tabindex="0">
        <input id="file" type="file" accept="image/*,video/*" hidden>
        <div id="dropHint">
          <strong>Trage un fișier aici</strong> sau apasă pentru a alege<br>
          <small>jpg, png, gif, webp, mp4, mov, webm · max 200 MB</small>
        </div>
        <div id="preview" class="preview hidden"></div>
      </div>
      <button id="clearFile" class="btn btn-ghost hidden" type="button">Elimină fișierul</button>

      <div class="divider"><span>sau</span></div>
      <input id="url" placeholder="URL extern de imagine (https://...)">

      <div id="progressWrap" class="progress hidden"><div id="progressBar"></div></div>

      <button id="submit" class="btn btn-primary btn-block">Publică</button>
    </section>

    <section>
      <h2 class="feed-title">Feed</h2>
      <div id="posts"></div>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>
  <script src="/js/app.js"></script>
</body>
</html>
